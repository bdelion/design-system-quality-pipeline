modelVersion: "2.2"
ruleVersion: "dq-2026.10-consolidation"
auditVersion: "2026.09"
scope: "configured-github-repositories"
githubOwner: "example"
repositories:
  - "design-system-core"
  - "design-system-react"
  - "design-system-docs"
github:
  labels:
    componentPrefix: "🧩 Component:"
    accessibilityCriticalityPrefix: "🚦 rgaa:"
    accessibilityCategoryPrefix: "♿ a11y:"
    unknown: "label:unknown"
    criticalityValues:
      bloquante: "blocking"
      majeure: "major"
      mineure: "minor"
  issueTypes:
    anomaly: "BUG"
    keywords:
      AUDIT:
        - "audit"
      EPIC:
        - "epic"
      NEW_COMPONENT:
        - "new_component"
        - "new component"
      FEATURE:
        - "feature"
      BUG:
        - "bug"
        - "rgaa"
        - "a11y"
  projectStatuses:
    keywords:
      BACKLOG:
        - "Backlog"
        - "📋 Backlog"
      READY:
        - "Ready"
        - "🔖 Ready"
      IN_PROGRESS:
        - "In progress"
        - "🏗 In progress"
      IN_REVIEW:
        - "In review"
        - "👀 In review"
      DONE:
        - "Done"
        - "✅ Done"
      BLOCKED:
        - "Blocked"
        - "✋ Blocked"
      CANCELLED:
        - "Cancelled"
        - "🛑 Cancelled"
  milestoneDetection:
    caseSensitive: false
    patterns:
      - id: release
        regex: '^(?<version>\d+\.\d+\.\d+)$'
        kind: release
      - id: audit
        regex: '^(?<version>\d+\.\d+\.\d+)-Audit$'
        kind: audit
  auditDetection:
    strategies:
      - issueTypes: [Audit]
        requireComponent: true
      - issueTypes: [Task]
        requiredLabels: ["Audit RGAA"]
        requireComponent: true
  closingKeywords:
    - "close"
    - "closed"
    - "closes"
    - "fix"
    - "fixed"
    - "fixes"
    - "resolve"
    - "resolved"
    - "resolves"
  cancelledProjectStatuses:
    - "Cancelled"
