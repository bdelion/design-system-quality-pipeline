rules:
  - id: DQ-001
    severity: ERROR
    action: exclude
    message: "Anomaly has no criticality."
  - id: DQ-002
    severity: ERROR
    action: exclude
    message: "Anomaly has incompatible multiple criticalities."
  - id: DQ-003
    severity: ERROR
    action: exclude
    message: "Anomaly has incompatible multiple parents."
  - id: DQ-004
    severity: WARNING
    action: include
    message: "Done issue has no identifiable pull request."
  - id: DQ-005
    severity: WARNING
    action: include
    message: "Merged pull request is linked to an open issue."
  - id: DQ-006
    severity: WARNING
    action: include
    message: "Source component is absent from the catalogue."
  - id: DQ-007
    severity: WARNING
    action: include
    message: "Issue contains an unknown label."
  - id: DQ-008
    severity: ERROR
    action: exclude
    message: "Cancelled issue is referenced by a pull request."
  - id: DQ-010
    severity: ERROR
    action: exclude
    message: "Cancelled issue is attached to a milestone."
  - id: DQ-009
    severity: WARNING
    action: include
    message: "Nexus is unavailable; release evidence is unknown."
  - id: DQ-011
    severity: WARNING
    action: include
    message: "Done and closed anomaly has no determinable correctedAt from Project status history."
  - id: DQ-012
    severity: WARNING
    action: include
    message: "Done and closed audit has no determinable completedAt from Project status history."
  - id: DQ-013
    severity: WARNING
    action: include
    message: "Anomaly Project status is Done while the GitHub issue is still open."
  - id: DQ-014
    severity: WARNING
    action: include
    message: "Audit Project status is Done while the GitHub issue is still open."

  - id: DQ-015
    severity: WARNING
    action: include
    message: "Historical catalogue is missing at the exact PROD tag."
  - id: DQ-016
    severity: WARNING
    action: include
    message: "Historical catalogue is invalid at the exact PROD tag."
  - id: DQ-017
    severity: WARNING
    action: include
    message: "GitHub Issue Type is missing."
  - id: DQ-018
    severity: WARNING
    action: include
    message: "GitHub Issue Type is not recognized by the current configuration."
  - id: DQ-019
    severity: WARNING
    action: include
    message: "GitHub Issue Type matches several canonical types."
  - id: DQ-020
    severity: WARNING
    action: include
    message: "Project status is not recognized by the current configuration."
  - id: DQ-021
    severity: WARNING
    action: include
    message: "Project status matches several canonical statuses."
  - id: DQ-022
    severity: WARNING
    action: include
    message: "Project Velocity is not numeric."
  - id: DQ-023
    severity: WARNING
    action: include
    message: "Audit Issue has no recognized Component."
  - id: DQ-024
    severity: WARNING
    action: include
    message: "Audit Issue has several recognized Components."
  - id: DQ-025
    severity: WARNING
    action: include
    message: "Audit Issue has no determinable target PROD Version."
  - id: DQ-026
    severity: WARNING
    action: include
    message: "Audit relation is expected but cannot be validated unambiguously."
  - id: DQ-027
    severity: WARNING
    action: include
    message: "Anomaly Component differs from its Audit Component."
  - id: DQ-028
    severity: WARNING
    action: include
    message: "Feature expects one valid Audit parent but the relation is absent, invalid or ambiguous."
  - id: DQ-029
    severity: ERROR
    action: exclude
    message: "Normalized entity contains an unresolved reference."
